# ============================================================
# 基础配置:可安全提交到 Git
# 本地敏感配置(密码等)放在 application-local.yml
# 该文件已被 .gitignore 忽略,模板见 application-local.yml.example
# ============================================================
server:
  port: 8080

spring:
  application:
    name: community-life-platform

  profiles:
    active: local

  # Knife4j 4.5.0 的扩展类与 springdoc 2.8 不兼容,排除其自动配置;
  # /doc.html 静态资源仍然可用,文档由 springdoc 生成。
  autoconfigure:
    exclude:
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/clp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: clp-default
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laotang.core.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 本地开发用,上线删掉

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Knife4j 中文界面:/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================================
# 业务配置
# ============================================================
clp:
  cache:
    # 店铺详情 Redis TTL
    shop-ttl: 30m
    # 商品含库存,变化频繁,TTL 更短
    product-ttl: 60s
    # 本地 Caffeine TTL,用于限制多节点脏读窗口
    local-ttl: 60s
    max-size: 10000
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expire: 30m
    refresh-token-expire: 7d
    issuer: community-life-platform
  order:
    timeout: 30m
  feed:
    # 粉丝数达到该阈值的作者视为大 V,只写发件箱,由读者拉取
    big-v-threshold: 1000
  ai:
    zhipu:
      base-url: https://open.bigmodel.cn
      # 必须形如 {id}.{secret},环境变量或本地配置提供
      api-key: ${ZHIPU_API_KEY:}
      embedding-model: embedding-3
      rerank-model: rerank-pro
      embedding-dimensions: 1024
    chat:
      # 每次请求带上的历史消息条数
      history-window: 20
      # 单用户每分钟最多请求次数
      rate-limit-per-minute: 20
      # 单次模型调用总超时
      timeout-ms: 15000
      # 连续失败达到阈值后熔断,打开期间直接降级
      circuit-failure-threshold: 5
      circuit-open-ms: 30000
      # 会话摘要记忆
      summary-enabled: true
      summary-trigger-messages: 30
      summary-max-chars: 300
    rag:
      enabled: true
      # 启动时导入 classpath:knowledge/*.md
      seed-enabled: true
      max-chunk-chars: 600
      # 向量与关键词两路召回候选数
      vector-candidates: 200
      keyword-candidates: 20
      # RRF 常数
      rrf-k: 60
      fusion-top-n: 10
      # 精排保留条数与证据阈值
      rerank-top-n: 4
      min-score: 0.35
      max-context-chars: 2000
      query-embedding-ttl: 1h
      result-ttl: 5m
      vector-cache-max: 5000