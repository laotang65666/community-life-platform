<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理看板 · 面向社区用户的生活服务平台</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --shadow: 0 8px 30px rgba(15, 23, 42, .06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
            background: linear-gradient(120deg, #111827, #1e3a8a);
            color: #fff;
        }

        .brand { font-size: 18px; font-weight: 700; letter-spacing: .02em; }
        .brand small { display: block; font-weight: 400; font-size: 12px; opacity: .7; margin-top: 4px; }

        .actions { display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .actions .updated { opacity: .72; }
        .actions button {
            border: 1px solid rgba(255,255,255,.35);
            background: rgba(255,255,255,.08);
            color: #fff;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .actions button:hover { background: rgba(255,255,255,.18); }

        main { max-width: 1180px; margin: 28px auto 60px; padding: 0 20px; }

        .card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 22px;
        }

        .hidden { display: none !important; }

        /* 登录 */
        .login-card {
            max-width: 420px;
            margin: 8vh auto 0;
            padding: 32px;
            text-align: left;
        }
        .login-card h1 { margin: 0 0 6px; font-size: 22px; }
        .login-card p { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.7; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        .field input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }
        .field input:focus { border-color: var(--primary); }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
        }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-secondary {
            background: var(--primary-soft);
            color: var(--primary);
            white-space: nowrap;
            width: auto;
            padding: 0 16px;
            font-size: 13px;
        }
        .banner {
            margin: 14px 0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }
        .banner.show { display: block; }
        .banner.ok { background: #ecfdf5; color: #047857; }
        .banner.error { background: #fef2f2; color: #b91c1c; }

        /* KPI */
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .kpi { padding: 20px 22px; }
        .kpi .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
        .kpi .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
        .kpi.accent .value { color: var(--primary); }
        .kpi.warn .value { color: var(--amber); }

        /* 图表 */
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .chart-card h3 { margin: 0 0 4px; font-size: 15px; }
        .chart-card .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
        .chart { width: 100%; min-height: 220px; }
        .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }

        @media (max-width: 860px) {
            .charts { grid-template-columns: 1fr; }
            header { padding: 16px 18px; }
            .actions .updated { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        生活服务平台 · 管理看板
        <small>用户 / 商户 / 店铺 / 订单 / 成交额</small>
    </div>
    <div class="actions">
        <span class="updated" id="updatedAt"></span>
        <button id="refreshBtn" class="hidden">刷新</button>
        <button id="logoutBtn" class="hidden">退出</button>
    </div>
</header>

<main>
    <section id="loginCard" class="card login-card">
        <h1>管理员登录</h1>
        <p>
            需要 ADMIN 角色账号。开发环境验证码会打印在服务端日志中，
            搜索 <code>[SMS]</code> 即可看到。
        </p>

        <div class="field">
            <label for="phone">手机号</label>
            <input id="phone" type="tel" placeholder="请输入管理员手机号" autocomplete="username">
        </div>

        <div class="field">
            <label for="code">验证码</label>
            <div class="row">
                <input id="code" type="text" placeholder="6 位验证码" autocomplete="one-time-code">
                <button id="sendCodeBtn" class="btn btn-secondary" type="button">发送验证码</button>
            </div>
        </div>

        <div id="loginBanner" class="banner"></div>
        <button id="loginBtn" class="btn" type="button">登录</button>
    </section>

    <section id="dashboard" class="hidden">
        <div id="dataBanner" class="banner"></div>

        <div class="kpis">
            <div class="card kpi accent">
                <div class="label">今日订单</div>
                <div class="value" id="todayOrders">-</div>
                <div class="hint">当天创建的全部订单</div>
            </div>
            <div class="card kpi accent">
                <div class="label">今日成交额</div>
                <div class="value" id="todayGmv">-</div>
                <div class="hint">已支付及之后状态</div>
            </div>
            <div class="card kpi warn">
                <div class="label">待审核商户</div>
                <div class="value" id="pendingAudits">-</div>
                <div class="hint">需要管理员处理</div>
            </div>
            <div class="card kpi">
                <div class="label">用户数</div>
                <div class="value" id="userCount">-</div>
                <div class="hint">平台注册用户</div>
            </div>
            <div class="card kpi">
                <div class="label">商户数</div>
                <div class="value" id="merchantCount">-</div>
                <div class="hint">审核通过</div>
            </div>
            <div class="card kpi">
                <div class="label">店铺数</div>
                <div class="value" id="shopCount">-</div>
                <div class="hint">未删除店铺</div>
            </div>
        </div>

        <div class="charts">
            <div class="card chart-card">
                <h3>近 7 天订单</h3>
                <div class="sub">下单数 / 支付数</div>
                <div id="orderChart" class="chart"></div>
            </div>
            <div class="card chart-card">
                <h3>近 7 天成交额</h3>
                <div class="sub">单位:元</div>
                <div id="gmvChart" class="chart"></div>
            </div>
        </div>
    </section>
</main>

<script>
    const API = '/api/v1';
    let token = sessionStorage.getItem('adminToken') || '';
    let countdownTimer = null;

    const $ = id => document.getElementById(id);

    function showBanner(el, message, type = 'error') {
        el.textContent = message;
        el.className = 'banner show ' + type;
    }

    function hideBanner(el) {
        el.className = 'banner';
        el.textContent = '';
    }

    function formatNumber(value) {
        return new Intl.NumberFormat('zh-CN').format(value ?? 0);
    }

    function formatMoney(cents) {
        return '¥ ' + new Intl.NumberFormat('zh-CN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format((cents ?? 0) / 100);
    }

    function shortDate(date) {
        return date && date.length >= 10 ? date.slice(5) : date;
    }

    async function postJson(path, body, withAuth = false) {
        const headers = { 'Content-Type': 'application/json' };
        if (withAuth) {
            headers['Authorization'] = 'Bearer ' + token;
        }
        const res = await fetch(API + path, {
            method: 'POST',
            headers,
            body: JSON.stringify(body)
        });
        return res.json();
    }

    async function loadDashboard() {
        try {
            const res = await fetch(API + '/admin/dashboard/summary', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const json = await res.json();

            if (json.code === 2001 || json.code === 2003) {
                logout();
                showBanner($('loginBanner'), '登录已失效或不是管理员账号,请重新登录');
                return;
            }
            if (json.code !== 0) {
                showBanner($('dataBanner'), json.message || ('请求失败 code=' + json.code));
                return;
            }

            hideBanner($('dataBanner'));
            render(json.data);
            $('updatedAt').textContent = '最后更新 ' + new Date().toLocaleTimeString('zh-CN');
        } catch (e) {
            showBanner($('dataBanner'), '无法连接服务:' + e.message);
        }
    }

    function render(data) {
        $('loginCard').classList.add('hidden');
        $('dashboard').classList.remove('hidden');
        $('refreshBtn').classList.remove('hidden');
        $('logoutBtn').classList.remove('hidden');

        $('todayOrders').textContent = formatNumber(data.todayOrders);
        $('todayGmv').textContent = formatMoney(data.todayGmv);
        $('pendingAudits').textContent = formatNumber(data.pendingMerchantAudits);
        $('userCount').textContent = formatNumber(data.userCount);
        $('merchantCount').textContent = formatNumber(data.merchantCount);
        $('shopCount').textContent = formatNumber(data.shopCount);

        const trend = Array.isArray(data.last7Days) ? data.last7Days : [];
        renderBarChart($('orderChart'), trend, [
            { key: 'orderCount', color: '#2563eb', name: '下单' },
            { key: 'paidCount', color: '#10b981', name: '支付' }
        ]);
        renderLineChart($('gmvChart'), trend);
    }

    function chartFrame(width, height, maxValue) {
        const pad = { left: 42, right: 16, top: 18, bottom: 30 };
        const innerW = width - pad.left - pad.right;
        const innerH = height - pad.top - pad.bottom;
        let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}"
                        role="img" aria-label="趋势图">`;

        for (let i = 0; i <= 4; i++) {
            const y = pad.top + innerH * i / 4;
            const value = Math.round(maxValue * (4 - i) / 4);
            svg += `<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}"
                          stroke="#eef2f7" stroke-width="1"/>`;
            svg += `<text x="${pad.left - 8}" y="${y + 4}" text-anchor="end"
                          font-size="10" fill="#9ca3af">${formatNumber(value)}</text>`;
        }
        return { svg, pad, innerW, innerH };
    }

    function renderBarChart(el, trend, series) {
        if (!trend.length) {
            el.innerHTML = '<div class="empty">暂无数据</div>';
            return;
        }
        const width = 560, height = 220;
        const maxValue = Math.max(
            1,
            ...trend.flatMap(item => series.map(s => Number(item[s.key] || 0)))
        );
        const { svg: base, pad, innerW, innerH } = chartFrame(width, height, maxValue);
        let svg = base;
        const groupW = innerW / trend.length;
        const barW = Math.min(14, groupW / (series.length + 1));

        trend.forEach((item, i) => {
            const center = pad.left + groupW * (i + 0.5);
            series.forEach((s, si) => {
                const value = Number(item[s.key] || 0);
                const barH = innerH * value / maxValue;
                const x = center - (series.length * barW) / 2 + si * barW;
                const y = pad.top + innerH - barH;
                svg += `<rect x="${x}" y="${y}" width="${barW - 2}" height="${Math.max(0, barH)}"
                              rx="3" fill="${s.color}"><title>${shortDate(item.date)} ${s.name}: ${value}</title></rect>`;
            });
            svg += `<text x="${center}" y="${height - 10}" text-anchor="middle"
                          font-size="10" fill="#9ca3af">${shortDate(item.date)}</text>`;
        });

        // 图例
        let legendX = pad.left;
        series.forEach(s => {
            svg += `<rect x="${legendX}" y="6" width="8" height="8" rx="2" fill="${s.color}"/>`;
            svg += `<text x="${legendX + 12}" y="13" font-size="10" fill="#6b7280">${s.name}</text>`;
            legendX += 56;
        });

        svg += '</svg>';
        el.innerHTML = svg;
    }

    function renderLineChart(el, trend) {
        if (!trend.length) {
            el.innerHTML = '<div class="empty">暂无数据</div>';
            return;
        }
        const width = 560, height = 220;
        const values = trend.map(item => Number(item.gmvYuan || 0));
        const maxValue = Math.max(1, ...values);
        const { svg: base, pad, innerW, innerH } = chartFrame(width, height, maxValue);
        let svg = base;

        const points = values.map((value, i) => {
            const x = pad.left + innerW * (trend.length === 1 ? 0.5 : i / (trend.length - 1));
            const y = pad.top + innerH - innerH * value / maxValue;
            return { x, y, value, date: trend[i].date };
        });

        if (points.length > 1) {
            const area = `M ${points[0].x} ${pad.top + innerH} ` +
                points.map(p => `L ${p.x} ${p.y}`).join(' ') +
                ` L ${points[points.length - 1].x} ${pad.top + innerH} Z`;
            svg += `<path d="${area}" fill="rgba(37,99,235,.08)"/>`;
            svg += `<polyline points="${points.map(p => `${p.x},${p.y}`).join(' ')}"
                              fill="none" stroke="#2563eb" stroke-width="2.5"
                              stroke-linecap="round" stroke-linejoin="round"/>`;
        }

        points.forEach(p => {
            svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#fff" stroke="#2563eb" stroke-width="2">
                        <title>${shortDate(p.date)}: ¥${p.value.toFixed(2)}</title>
                    </circle>`;
            svg += `<text x="${p.x}" y="${height - 10}" text-anchor="middle"
                          font-size="10" fill="#9ca3af">${shortDate(p.date)}</text>`;
        });

        svg += '</svg>';
        el.innerHTML = svg;
    }

    function logout() {
        token = '';
        sessionStorage.removeItem('adminToken');
        $('dashboard').classList.add('hidden');
        $('loginCard').classList.remove('hidden');
        $('refreshBtn').classList.add('hidden');
        $('logoutBtn').classList.add('hidden');
        $('updatedAt').textContent = '';
    }

    async function login() {
        const phone = $('phone').value.trim();
        const code = $('code').value.trim();
        if (!phone || !code) {
            showBanner($('loginBanner'), '请输入手机号和验证码');
            return;
        }

        $('loginBtn').disabled = true;
        try {
            const json = await postJson('/auth/login', { phone, code });
            if (json.code !== 0) {
                showBanner($('loginBanner'), json.message || '登录失败');
                return;
            }
            token = json.data.accessToken;
            sessionStorage.setItem('adminToken', token);
            hideBanner($('loginBanner'));
            await loadDashboard();
        } catch (e) {
            showBanner($('loginBanner'), '登录请求失败:' + e.message);
        } finally {
            $('loginBtn').disabled = false;
        }
    }

    async function sendCode() {
        const phone = $('phone').value.trim();
        if (!phone) {
            showBanner($('loginBanner'), '请先输入手机号');
            return;
        }

        const btn = $('sendCodeBtn');
        btn.disabled = true;
        try {
            const json = await postJson('/auth/sms-code', { phone });
            if (json.code !== 0) {
                showBanner($('loginBanner'), json.message || '发送失败');
                btn.disabled = false;
                return;
            }
            showBanner($('loginBanner'), '验证码已发送,请在服务端日志搜索 [SMS] 查看', 'ok');

            let seconds = 60;
            btn.textContent = seconds + 's';
            countdownTimer = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                } else {
                    btn.textContent = seconds + 's';
                }
            }, 1000);
        } catch (e) {
            showBanner($('loginBanner'), '发送失败:' + e.message);
            btn.disabled = false;
        }
    }

    $('loginBtn').addEventListener('click', login);
    $('sendCodeBtn').addEventListener('click', sendCode);
    $('refreshBtn').addEventListener('click', loadDashboard);
    $('logoutBtn').addEventListener('click', logout);
    $('code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    if (token) {
        loadDashboard();
    }
    setInterval(() => {
        if (token && !document.hidden) {
            loadDashboard();
        }
    }, 30000);
</script>

</body>
</html>
